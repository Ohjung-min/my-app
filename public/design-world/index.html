<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공매 낙찰 물건 한눈에 — 캠코 서울동부지역본부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* 캠코 색: 남색 #183a76(배경은 더 어둡게), 빨강 #ed1c24, 회색 */
  :root { --bg:#07142e; --fg:#fff; --red:#ed1c24; --pad-x: clamp(20px, 6.95vw, 120px); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#07142e; color:#fff; font-family:'Noto Sans KR','Poppins',sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }

  .hero { position:relative; width:100%; height:100vh; height:100svh; min-height:520px; overflow:hidden; background:#07142e; }
  /* 위쪽 남색→빨강 띠 (캠코 로고 색) */
  .hero::before { content:''; position:absolute; left:0; right:0; top:0; height:6px; z-index:3; background:linear-gradient(90deg,#183a76 0%,#183a76 60%,#ed1c24 100%); }
  #scene { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  #scene.dragging { cursor:grabbing; }
  .ui { position:absolute; inset:0; pointer-events:none; z-index:2; }
  .ui a, .ui button { pointer-events:auto; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* NAV */
  .nav { position:absolute; top:clamp(24px,4.7vh,40px); left:var(--pad-x); right:var(--pad-x); display:flex; align-items:center; justify-content:space-between; }
  .logo { display:flex; align-items:center; gap:8px; color:#fff; text-decoration:none; font-size:15px; letter-spacing:-0.01em; }
  .logo-img { height:46px; width:auto; display:block; background:#fff; border-radius:10px; padding:4px 8px; }
  .logo b { font-weight:700; }
  .logo span { font-weight:400; color:#ff5a60; }
  .note { position:absolute; left:var(--pad-x); bottom:14px; font-size:11px; color:rgba(255,255,255,.55); }
  .nav-links { display:flex; gap:clamp(20px,4.1vw,60px); list-style:none; }
  .nav-links a { color:#fff; text-decoration:none; font-size:15px; font-weight:500; position:relative; cursor:pointer; }
  .nav-links a::after { content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .35s ease; }
  .nav-links a:hover::after { transform:scaleX(1); transform-origin:left; }

  /* ARROWS */
  .arrows { position:absolute; top:18.9%; left:76.7%; display:flex; gap:32px; transform:translate(-19px,-50%); }
  .arrow { width:38px; height:38px; border-radius:50%; border:2.5px solid #fff; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer; transition:background .25s, color .25s; }
  .arrow svg { width:18px; height:18px; }
  .arrow:hover { background:#fff; color:#000; }

  /* DOTS */
  .dots { position:absolute; right:calc(var(--pad-x) - 7px); top:49.4%; transform:translateY(-50%); display:flex; flex-direction:column; gap:33px; }
  .dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; background:#fff; cursor:pointer; transition:background .25s; padding:0; }
  .dot.active { background:transparent; }

  /* TAGLINE */
  .tagline { position:absolute; left:var(--pad-x); bottom:clamp(40px,7.5vh,70px); font-size:clamp(24px,2.65vw,44px); line-height:1.2; font-weight:300; letter-spacing:-0.01em; }
  .tagline strong { font-weight:700; display:block; }

  /* CTA ROW */
  .cta-row { position:absolute; left:45.6%; right:-1vw; top:88.7%; transform:translateY(-50%); display:flex; align-items:center; }
  .cta { flex:none; padding:0 15px; height:48px; display:inline-flex; align-items:center; border:1.5px solid rgba(255,255,255,.85); border-radius:6px; background:rgba(0,0,0,.15); color:#fff; font-size:14px; font-weight:400; text-decoration:none; cursor:pointer; transition:background .25s, color .25s; }
  .cta:hover { background:#fff; color:#000; }
  .cta-line { flex:1; height:1.5px; background:rgba(255,255,255,.8); min-width:40px; }
  .count { flex:none; font-family:'Poppins',sans-serif; font-size:clamp(140px,19.8vw,360px); font-weight:400; line-height:1; letter-spacing:-0.02em; color:transparent; -webkit-text-stroke:1.5px rgba(237,28,36,.95); transform:translateY(6%); user-select:none; }
  .cta { border-color:#ed1c24; background:#ed1c24; }
  .cta:hover { background:#fff; color:#183a76; border-color:#fff; }
  .cta-line { background:rgba(237,28,36,.85); }
  .arrow:hover { background:#ed1c24; border-color:#ed1c24; color:#fff; }

  /* LOADER */
  .loader { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:.6; transition:opacity .6s; }
  .loader.done { opacity:0; }

  /* RESPONSIVE */
  @media (max-width:900px), (max-aspect-ratio:1/1) {
    .arrows { left:auto; right:var(--pad-x); top:15%; transform:translateY(-50%); gap:14px; }
    .tagline { bottom:clamp(150px,20vh,220px); }
    .cta-row { left:var(--pad-x); right:-3vw; top:auto; bottom:24px; transform:none; }
    .count { font-size:clamp(120px,22vw,200px); }
    .note { display:none; }
  }
  @media (max-width:640px) {
    .nav-links { gap:16px; }
    .nav-links a, .logo { font-size:13px; }
    .dots { gap:20px; right:16px; }
    .dot { width:10px; height:10px; }
    .cta-row { right:-8vw; }
    .count { font-size:120px; }
  }
  @media (max-width:420px) { .nav-links li:nth-child(2) { display:none; } }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

const canvas = document.getElementById('scene');
const loaderEl = document.getElementById('loader');

/* ---------- renderer / camera ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setClearColor(0x07142e, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;

const FOV = 30;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

/* ---------- background headline (2D canvas -> texture -> fullscreen quad) ---------- */
const textCanvas = document.createElement('canvas');
const textCtx = textCanvas.getContext('2d');
let textTexture = null;

const bgScene = new THREE.Scene();
const bgMat = new THREE.ShaderMaterial({
  uniforms: { uTex: { value: null } },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D uTex;
    varying vec2 vUv;
    void main() {
      gl_FragColor = texture2D(uTex, vUv);
      #include <colorspace_fragment>
    }`,
  depthTest: false,
  depthWrite: false,
});
const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgQuad.frustumCulled = false;
bgScene.add(bgQuad);

let W = window.innerWidth, H = window.innerHeight, DPR = 1;
const isMobile = () => (W < 768) || (W / H < 1);

function drawHeadline() {
  const mobile = isMobile();
  textCanvas.width = Math.max(1, Math.round(W * DPR));
  textCanvas.height = Math.max(1, Math.round(H * DPR));
  const ctx = textCtx;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 캠코 남색 배경: 가운데는 밝은 남색, 가장자리는 어두운 남색
  const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.75);
  bgGrad.addColorStop(0, '#16356f');
  bgGrad.addColorStop(1, '#06122b');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 한 줄로 작게 위쪽에 두어, 가운데에는 유리 모형만 보이게 한다
  const lines = ['공매 낙찰 물건 한눈에'];
  const FONT = (s) => `900 ${s}px "Noto Sans KR", Poppins, sans-serif`;
  let fs = Math.min(H * 0.09, W * (mobile ? 0.075 : 0.055));
  ctx.font = FONT(fs);
  let widest = Math.max(...lines.map(l => ctx.measureText(l).width));
  const maxW = W * (mobile ? 0.9 : 0.8);
  if (widest > maxW) {
    fs *= maxW / widest;
    ctx.font = FONT(fs);
  }
  ctx.fillStyle = '#eef2fb';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  // 큐브가 가운데를 가려 글자가 흐려지므로, 큰 글자는 가운데보다 위쪽에 둔다
  const cx = W * (mobile ? 0.5 : 0.505);
  const cy = H * (mobile ? 0.28 : 0.23);
  const gap = fs * 1.12;
  const cap = fs * 0.8;
  lines.forEach((l, i) => {
    ctx.fillText(l, cx, cy + cap / 2 + (i - 1) * gap);
  });

  // a fresh texture each time (canvas size can change on resize)
  const old = textTexture;
  textTexture = new THREE.CanvasTexture(textCanvas);
  textTexture.colorSpace = THREE.SRGBColorSpace;
  textTexture.minFilter = THREE.LinearFilter;
  textTexture.magFilter = THREE.LinearFilter;
  textTexture.generateMipmaps = false;
  textTexture.needsUpdate = true;
  bgMat.uniforms.uTex.value = textTexture;
  if (old) old.dispose();
}

/* ---------- glass material ---------- */
const vertexShader = /* glsl */`
  varying vec3 vNormal;
  varying vec3 vEye;
  void main() {
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vec4 mvPos = viewMatrix * worldPos;
    gl_Position = projectionMatrix * mvPos;
    vNormal = normalize(normalMatrix * normal);
    vEye = normalize(mvPos.xyz);
  }`;

const fragmentShader = /* glsl */`
  precision highp float;
  uniform sampler2D uTexture;
  uniform vec2 uResolution;
  uniform float uBackside;
  uniform float uIorR, uIorY, uIorG, uIorC, uIorB, uIorP;
  uniform float uRefractPower, uChromatic, uSaturation;
  uniform float uShininess, uDiffuseness, uFresnelPower;
  uniform vec3 uLight;
  varying vec3 vNormal;
  varying vec3 vEye;

  const int LOOP = 16;

  float specular(vec3 light, float shininess, float diffuseness, vec3 n, vec3 eye) {
    vec3 lightVec = normalize(-light);
    vec3 viewVec = -eye;
    vec3 halfVec = normalize(lightVec + viewVec);
    float s = pow(max(dot(n, halfVec), 0.0), shininess);
    s += max(0.0, dot(n, lightVec)) * diffuseness;
    return s;
  }

  vec3 tex(vec2 uv, vec3 refr, float k, float slide) {
    vec2 o = uv + refr.xy * (uRefractPower + slide * k) * uChromatic;
    return texture2D(uTexture, o).rgb;
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / uResolution;
    vec3 n = normalize(vNormal);
    if (uBackside > 0.5) n = -n;
    vec3 eye = normalize(vEye);

    vec3 color = vec3(0.0);
    for (int i = 0; i < LOOP; i++) {
      float slide = float(i) / float(LOOP) * 0.045;

      vec3 rR = refract(eye, n, 1.0 / uIorR);
      vec3 rY = refract(eye, n, 1.0 / uIorY);
      vec3 rG = refract(eye, n, 1.0 / uIorG);
      vec3 rC = refract(eye, n, 1.0 / uIorC);
      vec3 rB = refract(eye, n, 1.0 / uIorB);
      vec3 rP = refract(eye, n, 1.0 / uIorP);

      float r = tex(uv, rR, 1.0, slide).x * 0.5;

      vec3 yv = tex(uv, rY, 1.0, slide);
      float y = (yv.x * 2.0 + yv.y * 2.0 - yv.z) / 6.0;

      float g = tex(uv, rG, 2.0, slide).y * 0.5;

      vec3 cv = tex(uv, rC, 2.5, slide);
      float c = (cv.y * 2.0 + cv.z * 2.0 - cv.x) / 6.0;

      float b = tex(uv, rB, 3.0, slide).z * 0.5;

      vec3 pv = tex(uv, rP, 1.0, slide);
      float p = (pv.z * 2.0 + pv.x * 2.0 - pv.y) / 6.0;

      float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
      float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
      float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

      color += vec3(R, G, B);
    }
    color /= float(LOOP);

    float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
    color = mix(vec3(luma), color, uSaturation);

    float spec = specular(uLight, uShininess, uDiffuseness, n, eye)
               + 0.6 * specular(vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5, n, eye);
    color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

    float f = pow(1.0 + dot(eye, n), uFresnelPower);
    color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));

    color += vec3(0.004, 0.005, 0.007);
    gl_FragColor = vec4(color, 1.0);
    #include <colorspace_fragment>
  }`;

function makeGlassMaterial(backside) {
  return new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    side: backside ? THREE.BackSide : THREE.FrontSide,
    uniforms: {
      uTexture: { value: null },
      uResolution: { value: new THREE.Vector2(1, 1) },
      uBackside: { value: backside ? 1 : 0 },
      uIorR: { value: 1.15 }, uIorY: { value: 1.16 }, uIorG: { value: 1.18 },
      uIorC: { value: 1.22 }, uIorB: { value: 1.22 }, uIorP: { value: 1.22 },
      uRefractPower: { value: backside ? 0.22 : 0.30 },
      uChromatic: { value: 0.5 },
      uSaturation: { value: 1.08 },
      uShininess: { value: 90 },
      uDiffuseness: { value: 0.02 },
      uFresnelPower: { value: 5.0 },
      uLight: { value: new THREE.Vector3(-1, 1, 1) },
    },
  });
}
const frontMat = makeGlassMaterial(false);
const backMat = makeGlassMaterial(true);

/* ---------- render targets ---------- */
const rtOpts = { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true };
const rtBack = new THREE.WebGLRenderTarget(1, 1, rtOpts);
const rtFront = new THREE.WebGLRenderTarget(1, 1, rtOpts);
backMat.uniforms.uTexture.value = rtBack.texture;
frontMat.uniforms.uTexture.value = rtFront.texture;

/* ---------- scene graph ---------- */
const scene = new THREE.Scene();
const pivot = new THREE.Group();
const spinner = new THREE.Group();
scene.add(pivot);
pivot.add(spinner);
spinner.rotation.set(-0.42, 0.62, 0.18);
let cube = null;

function setCubeGeometry(geometry) {
  geometry.computeBoundingBox();
  const box = geometry.boundingBox;
  const center = new THREE.Vector3();
  box.getCenter(center);
  geometry.translate(-center.x, -center.y, -center.z);
  const size = new THREE.Vector3();
  box.getSize(size);
  const max = Math.max(size.x, size.y, size.z) || 1;
  geometry.scale(1 / max, 1 / max, 1 / max);
  cube = new THREE.Mesh(geometry, frontMat);
  cube.frustumCulled = false;
  spinner.add(cube);
  loaderEl.classList.add('done');
}

function useFallback() {
  if (cube) return;
  const g = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
  setCubeGeometry(g);
}

new GLTFLoader().load(
  MODEL_URL,
  (gltf) => {
    try {
      const parts = [];
      gltf.scene.updateMatrixWorld(true);
      gltf.scene.traverse((o) => {
        if (!o.isMesh) return;
        let g = o.geometry.clone();
        ['uv', 'color', 'tangent'].forEach((a) => g.deleteAttribute(a));
        g = mergeVertices(g, 1e-4);
        g.computeVertexNormals();
        g.applyMatrix4(o.matrixWorld);
        parts.push(g);
      });
      if (!parts.length) throw new Error('no meshes');
      const merged = parts.length === 1 ? parts[0] : mergeGeometries(parts, false);
      if (!merged) throw new Error('merge failed');
      setCubeGeometry(merged);
    } catch (e) {
      console.warn('Model processing failed, using fallback', e);
      useFallback();
    }
  },
  undefined,
  (err) => {
    console.warn('Model failed to load, using fallback', err);
    useFallback();
  }
);

/* ---------- layout ---------- */
function layout() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);
  renderer.setSize(W, H, false);

  camera.aspect = W / H;
  camera.updateProjectionMatrix();

  const bw = Math.round(W * DPR), bh = Math.round(H * DPR);
  rtBack.setSize(bw, bh);
  rtFront.setSize(bw, bh);
  const drawSize = new THREE.Vector2();
  renderer.getDrawingBufferSize(drawSize);
  backMat.uniforms.uResolution.value.copy(drawSize);
  frontMat.uniforms.uResolution.value.copy(drawSize);

  drawHeadline();

  const mobile = isMobile();
  const visH = 2 * Math.tan(THREE.MathUtils.degToRad(FOV) / 2) * 10;
  const visW = visH * camera.aspect;
  const sx = mobile ? 0.5 : 0.517;
  const sy = mobile ? 0.55 : 0.55;
  pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);
  const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
  pivot.scale.setScalar((px / H) * visH);
}

/* ---------- interaction ---------- */
const AX_X = new THREE.Vector3(1, 0, 0);
const AX_Y = new THREE.Vector3(0, 1, 0);
const qTmp = new THREE.Quaternion();

let dragging = false;
let lastX = 0, lastY = 0, lastT = 0;
let velX = 0, velY = 0;          // radians per 16.67ms frame
let releaseAt = 0;               // time of last interaction end (ms)
let spinRemaining = 0;

function rotateWorld(dx, dy) {
  if (dx) { qTmp.setFromAxisAngle(AX_Y, dx); spinner.quaternion.premultiply(qTmp); }
  if (dy) { qTmp.setFromAxisAngle(AX_X, dy); spinner.quaternion.premultiply(qTmp); }
}

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  spinRemaining = 0;
  velX = velY = 0;
  lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
  canvas.classList.add('dragging');
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const now = performance.now();
  const dx = (e.clientX - lastX) * 0.008;
  const dy = (e.clientY - lastY) * 0.008;
  rotateWorld(dx, dy);
  const frames = Math.max((now - lastT) / 16.67, 0.25);
  velX = dx / frames;
  velY = dy / frames;
  lastX = e.clientX; lastY = e.clientY; lastT = now;
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  releaseAt = performance.now();
  canvas.classList.remove('dragging');
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function spinBy(angle) {
  velX = velY = 0;
  spinRemaining += angle;
  releaseAt = performance.now();
}
document.getElementById('prev').addEventListener('click', () => spinBy(-Math.PI / 2));
document.getElementById('next').addEventListener('click', () => spinBy(Math.PI / 2));

const dotEls = [...document.querySelectorAll('.dot')];
dotEls.forEach((d) => d.addEventListener('click', () => {
  dotEls.forEach((o) => o.classList.toggle('active', o === d));
}));

/* ---------- render loop ---------- */
let prevTime = performance.now();
function renderPass() {
  // 1) background -> rtBack
  renderer.setRenderTarget(rtBack);
  renderer.clear(true, true, true);
  renderer.render(bgScene, camera);

  if (cube) {
    // 2) background + back faces -> rtFront
    renderer.setRenderTarget(rtFront);
    renderer.clear(true, true, true);
    renderer.render(bgScene, camera);
    cube.material = backMat;
    renderer.render(scene, camera);
  }

  // 3) background (+ front faces) -> screen
  renderer.setRenderTarget(null);
  renderer.clear(true, true, true);
  renderer.render(bgScene, camera);
  if (cube) {
    renderer.clearDepth();
    cube.material = frontMat;
    renderer.render(scene, camera);
  }
}

function frame(now) {
  const dt = Math.min((now - prevTime) / 1000, 0.05);
  prevTime = now;
  const f = dt * 60;

  if (!dragging) {
    // inertia
    if (velX || velY) {
      rotateWorld(velX * f, velY * f);
      const damp = Math.pow(0.94, f);
      velX *= damp; velY *= damp;
      if (Math.abs(velX) < 1e-5) velX = 0;
      if (Math.abs(velY) < 1e-5) velY = 0;
    }
    // arrow spin
    if (spinRemaining !== 0) {
      if (Math.abs(spinRemaining) < 0.0005) {
        rotateWorld(spinRemaining, 0);
        spinRemaining = 0;
      } else {
        const step = spinRemaining * Math.min(1, 0.09 * f);
        rotateWorld(step, 0);
        spinRemaining -= step;
      }
    }
    // idle drift (ramps in 0.6s after release, over 1s)
    const blend = THREE.MathUtils.clamp((now - releaseAt - 600) / 1000, 0, 1);
    if (blend > 0 && spinRemaining === 0) {
      rotateWorld(0.0035 * blend * f, 0.0012 * blend * f);
    }
  }

  renderPass();
  requestAnimationFrame(frame);
}

window.addEventListener('resize', layout);
if (document.fonts && document.fonts.addEventListener) {
  document.fonts.addEventListener('loadingdone', () => { drawHeadline(); });
}

const fontReady = Promise.race([
  Promise.all([document.fonts.load('900 100px "Noto Sans KR"', '공매낙찰물건한눈에'), document.fonts.ready]),
  new Promise((res) => setTimeout(res, 2500)),
]);
fontReady.then(() => {
  layout();
  prevTime = performance.now();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
